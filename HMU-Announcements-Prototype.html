<script>
'use strict';const $=id=>document.getElementById(id), svg=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const GROUPS='ABCDEFGH'.split(''),KEY='hmu-announcements-prototype-v2';
const now=Date.now(), seed=[{id:'seed1',channel:'s2-all',author:'admin',text:'Good morning everyone. Tomorrow’s Anatomy lecture will begin at 9:00 AM in the main lecture hall.',at:now-1000*60*180,pinned:false},{id:'seed2',channel:'s2-all',author:'super',text:'The MSD examination schedule will be shared here. Please check the portal regularly for official updates.',at:now-1000*60*130,pinned:true},{id:'seed3',channel:'s2-A',author:'admin',text:'Tomorrow’s practical session starts at 11:00 AM. Please bring your laboratory coats.',at:now-1000*60*65,pinned:false},{id:'seed4',channel:'s2-A',author:'admin',text:'Please review SGL 8 before your next session.',at:now-1000*60*20,pinned:false},{id:'seed5',channel:'s2-B',author:'admin',text:'Group B: your practical session will start at 12:30 PM.',at:now-1000*60*25,pinned:false}];
const ACCOUNTS=[...GROUPS.map(g=>({id:'group-'+g,name:'Group '+g+' administrator',initial:g,scope:'group',groups:[g]})),...Array.from({length:3},(_,i)=>({id:'stage-'+(i+1),name:'Stage administrator '+(i+1),initial:String(i+1),scope:'stage',groups:[]}))];
const defaults=()=>Object.fromEntries(ACCOUNTS.map(a=>[a.id,{scope:a.scope,groups:[...a.groups]}]));
seed.forEach(m=>{if(m.author==='admin')m.author=m.channel==='s2-A'?'group-A':m.channel==='s2-B'?'group-B':'stage-1'});seed.push({id:'seed6',channel:'college',author:'super',text:'Welcome to the official Medicine announcements. Important college-wide updates will appear here.',at:now-1000*60*240,pinned:false});
let data={messages:structuredClone(seed),reads:{},permissions:defaults()}, account='group-A', role='student',stage=2,group='A',superStage=2,active=null,attachment=null,editId=null,query='',toastTimer,previousFocus=null;try{const stored=JSON.parse(localStorage.getItem(KEY)||'null');if(stored&&Array.isArray(stored.messages)&&stored.reads)data={...stored,permissions:stored.permissions||defaults()}}catch{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{toast('Storage is full or unavailable. Changes remain in this tab only.');return false}}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3200)}
function profile(){return data.permissions[account]||{scope:'none',groups:[]}}function actor(){return role==='super'?'super':role==='admin'?account:'student'}function globalAccess(){return role==='super'||role==='admin'&&profile().scope==='medicine'}function currentStage(){return globalAccess()?superStage:role==='admin'?2:stage}function isStudent(){return role==='student'}function canWrite(c){if(!c||isStudent())return false;if(role==='super')return true;const p=profile();if(p.scope==='medicine')return c==='college'||/^s[1-6]-(all|[A-H])$/.test(c);if(p.scope==='stage')return /^s2-(all|[A-H])$/.test(c);return p.scope==='group'&&p.groups.some(g=>c==='s2-'+g)}function channels(){let s=currentStage(),a=['college',`s${s}-all`];if(s===2){let gs=isStudent()?[group]:globalAccess()||profile().scope==='stage'?GROUPS:profile().scope==='group'?profile().groups:[];a.push(...gs.map(g=>`s2-${g}`))}return a}function title(c){return c==='college'?'All Medicine students':c.endsWith('-all')?'All groups':'Group '+c.split('-')[1]}function desc(c){return c==='college'?'College-wide · Stages 1–6':`Medicine · Stage ${c.match(/^s(\d)/)[1]} · ${c.endsWith('-all')?'All groups':'Group '+c.split('-')[1]}`}function channelIcon(c){return `<span class="channel-icon ${c==='college'?'college':c.endsWith('-all')?'general':''}">${c==='college'?svg('megaphone'):c.endsWith('-all')?svg('users'):esc(c.split('-')[1])}</span>`}function author(m){return m.author==='super'?'University Administration':ACCOUNTS.find(a=>a.id===m.author)?.name||'Stage Administration'}function userKey(){return `student-${stage}-${stage===2?group:'all'}`}function messages(c){return data.messages.filter(m=>m.channel===c).sort((a,b)=>a.at-b.at)}function seen(m){return !!data.reads[userKey()]?.[m.id]}function unread(c){return isStudent()?messages(c).filter(m=>!seen(m)).length:0}function markRead(c){if(!isStudent()||!channels().includes(c))return;let r=data.reads[userKey()]||(data.reads[userKey()]={});let changed=false;for(const m of messages(c))if(!r[m.id]){r[m.id]=true;changed=true}if(changed)save()}
function time(t){return new Intl.DateTimeFormat('en',{hour:'numeric',minute:'2-digit'}).format(t)}function day(t){const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?'Today':new Intl.DateTimeFormat('en',{day:'numeric',month:'long',year:d.getFullYear()===n.getFullYear()?undefined:'numeric'}).format(d)}function short(m){return m.text||m.file?.name||'Attachment'}function bytes(n){return n<1024?`${n} B`:n<1048576?`${Math.round(n/1024)} KB`:`${(n/1048576).toFixed(1)} MB`}
function renderSidebar(){let s=currentStage();$('roleName').textContent=role==='admin'?(ACCOUNTS.find(a=>a.id===account)?.name||'Administrator'):{student:'Student',super:'Super admin'}[role];$('roleAvatar').textContent=role==='admin'?(ACCOUNTS.find(a=>a.id===account)?.initial||'A'):role==='student'?group:'S';$('manageBtn').hidden=role!=='super';$('sideSub').textContent=`Stage ${s}${isStudent()&&s===2?' · Group '+group:''}${isStudent()?' · Your channels':role==='admin'?' · '+scopeLabel(profile()):' · Manage channels'}`;$('stageScope').innerHTML=globalAccess()?`<select id="superSelect" aria-label="Select stage">${[1,2,3,4,5,6].map(v=>`<option ${v===s?'selected':''} value="${v}">Stage ${v}</option>`).join('')}</select>`:'';if($('superSelect'))$('superSelect').onchange=e=>{superStage=+e.target.value;resetChat();renderSidebar()};const q=$('channelSearch').value.trim().toLowerCase();let cs=channels().filter(c=>title(c).toLowerCase().includes(q));$('channels').innerHTML=(cs.length?'<div class="sectionlabel">'+(isStudent()?'Your channels':'Available channels')+'</div>':'')+cs.map(c=>{const ms=messages(c),m=ms.at(-1),u=unread(c);return `<button class="channel ${active===c?'selected':''}" data-channel="${c}" aria-label="${esc(title(c))}${u?', '+u+' unread':''}">${channelIcon(c)}<div class="channel-info"><div class="channel-title">${title(c)}</div><div class="channel-last">${esc(m?short(m):c==='college'?'Announcements for every stage':'No announcements yet')}</div></div><div class="channel-meta">${m?time(m.at):''}${u?`<span class="count">${u>99?'99+':u}</span>`:!isStudent()&&!canWrite(c)?`<span class="lockmark">${svg('lock')}</span>`:''}</div></button>`}).join('')||'<div class="empty"><p>No matching channels.</p></div>';for(const b of $('channels').querySelectorAll('button'))b.onclick=()=>openChannel(b.dataset.channel)}
function resetDraft(){attachment=null;editId=null;$('message').value='';$('message').style.height='auto';$('attachMenu').hidden=true;updateComposer()}
function resetChat(){active=null;query='';$('msgSearch').value='';$('chatSearch').hidden=true;$('layout').classList.remove('inchat');resetDraft();renderChat()}
function openChannel(c){if(!channels().includes(c))return;if(active!==c){resetDraft();query='';$('msgSearch').value='';$('chatSearch').hidden=true}active=c;$('layout').classList.add('inchat');renderChat(true);if(isStudent())markRead(c);renderSidebar()}
function renderChat(bottom=false){const ok=active&&channels().includes(active);$('blank').hidden=!!ok;$('chathead').hidden=!ok;$('scroll').hidden=!ok;$('pinned').hidden=true;$('composer').hidden=!ok||!canWrite(active);$('readonly').hidden=!ok||canWrite(active);$('readonly').innerHTML=svg('lock')+(isStudent()?' Official channel · Read only':' Read only · Publishing permission required');if(!ok)return;$('chatIcon').innerHTML=channelIcon(active);$('chatName').textContent=title(active);$('chatDesc').textContent=desc(active);$('recipientNote').textContent='To: '+(active==='college'?'All Medicine students':'Stage '+currentStage()+' · '+title(active));const all=messages(active),pin=all.filter(m=>m.pinned).at(-1);if(pin&&!query){$('pinned').hidden=false;$('pinText').textContent=short(pin);$('pinned').onclick=()=>document.getElementById('m-'+pin.id)?.scrollIntoView({block:'center',behavior:'smooth'})}const filtered=all.filter(m=>!query||[m.text,m.file?.name,author(m)].join(' ').toLowerCase().includes(query));let lastDay='',out='',newShown=false;for(const m of filtered){let d=day(m.at);if(d!==lastDay){out+=`<div class="date">${esc(d)}</div>`;lastDay=d}if(isStudent()&&!seen(m)&&!newShown){out+='<div class="newsep">New messages</div>';newShown=true}let mine=!isStudent()&&m.author===actor();out+=`<article id="m-${esc(m.id)}" class="msg ${mine?'mine':''}">${mine?'':`<div class="mini">${m.author==='super'?'HMU':esc(ACCOUNTS.find(a=>a.id===m.author)?.initial||'SA')}</div>`}${mine?`<button class="iconbtn msgmenu" data-menu="${esc(m.id)}" aria-label="Message actions">${svg('more')}</button>`:''}<div class="bubble" data-bubble="${esc(m.id)}">${mine?'':`<div class="sender">${author(m)} ${svg('shield')}</div>`}${m.channel==='college'?'<div class="sender">College-wide announcement</div>':''}${m.text?`<div class="text">${esc(m.text)}</div>`:''}${m.file?fileHTML(m.file):''}<div class="meta">${m.pinned?svg('pin'):''}${m.edited?'Edited · ':''}${time(m.at)}${mine?svg('check'):''}</div></div>${mine?'':`<button class="iconbtn msgmenu" data-menu="${esc(m.id)}" aria-label="Message actions">${svg('more')}</button>`}</article>`}if(!out)out=`<div class="empty" style="min-height:240px"><div><div class="empty-icon">${svg('chat')}</div><strong>${query?'No matching messages':'No announcements yet'}</strong><p>${query?'Try another search.':canWrite(active)?'Send the first academic update.':'New academic updates will appear here.'}</p></div></div>`;$('stream').innerHTML=out;for(const b of $('stream').querySelectorAll('[data-menu]'))b.onclick=()=>messageActions(b.dataset.menu);for(const b of $('stream').querySelectorAll('[data-bubble]')){let timer;const clear=()=>clearTimeout(timer);b.oncontextmenu=e=>{if(e.target.closest('a'))return;e.preventDefault();messageActions(b.dataset.bubble)};b.addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;timer=setTimeout(()=>messageActions(b.dataset.bubble),650)});for(const ev of ['pointerup','pointercancel','pointermove'])b.addEventListener(ev,clear)}if(bottom)requestAnimationFrame(()=>{$('scroll').scrollTop=$('scroll').scrollHeight})}
function fileHTML(f){const safe=typeof f.data==='string'&&/^data:(?:application\/pdf|image\/(?:png|jpeg|webp|gif)|text\/plain);base64,[A-Za-z0-9+/=]+$/.test(f.data);if(!safe)return '<div class="filecard">Attachment unavailable</div>';let href=esc(f.data), name=esc(f.name);return `${f.type.startsWith('image/')?`<a href="${href}" download="${name}"><img class="attachment-image" src="${href}" alt="${name}"></a>`:''}<a class="filecard" href="${href}" download="${name}"><span class="fileicon">${svg(f.type.startsWith('image/')?'image':'file')}</span><span style="flex:1;min-width:0"><strong>${name}</strong><small>${bytes(f.size)} · ${f.type==='application/pdf'?'PDF':f.type.startsWith('image/')?'Image':'Text'}</small></span>${svg('download')}</a>`}
function updateComposer(){const m=$('message');$('sendBtn').disabled=!canWrite(active)||(!m.value.trim()&&!attachment);$('editing').hidden=!editId;$('draftfile').hidden=!attachment;if(attachment){$('draftfile').innerHTML=`${svg('file')}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(attachment.name)} · ${bytes(attachment.size)}</span><button id="removeFile" aria-label="Remove attachment">${svg('x')}</button>`;$('removeFile').onclick=()=>{attachment=null;updateComposer()}}}
function uid(){return globalThis.crypto?.randomUUID?.()||`m-${Date.now()}-${Math.random().toString(36).slice(2)}`}
function send(){if(!canWrite(active)||!channels().includes(active))return;let text=$('message').value.trim();if(!text&&!attachment)return;if(!editId&&(active==='college'||active.endsWith('-all'))&&!confirm('Publish this announcement to '+(active==='college'?'all Medicine students (Stages 1–6)':'everyone in Stage '+currentStage())+'?'))return;if(editId){let m=data.messages.find(x=>x.id===editId);if(!m||!canManage(m))return;m.text=text;m.file=attachment;m.edited=true}else data.messages.push({id:uid(),channel:active,author:actor(),text,file:attachment,at:Date.now(),pinned:false});let wasEdit=!!editId;const persisted=save();resetDraft();renderChat(true);renderSidebar();if(persisted)toast(wasEdit?'Announcement updated':'Announcement sent · demo only')}
function canManage(m){return !!m&&canWrite(m.channel)&&(role==='super'||m.author===actor())}
function showModal(html){previousFocus=document.activeElement;$('modalBody').innerHTML=html;if(!$('modal').open)$('modal').showModal();$('modalBody').querySelector('[data-close]')?.addEventListener('click',()=>$('modal').close())}
const modalHead=t=>`<div class="modal-title">${esc(t)}<button class="iconbtn" data-close aria-label="Close">${svg('x')}</button></div>`;
function scopeLabel(p){return p.scope==='medicine'?'All Medicine stages':p.scope==='stage'?'Stage 2 · All groups':p.scope==='group'?(p.groups.length?'Group '+p.groups.join(', '):'Read only'):'Read only'}
function roleModal(){showModal(modalHead('Switch demo account')+`<p>Explore the actual student and administrator experiences. All accounts below are simulated.</p><div class="settingsline"><label for="demoStage">Student stage</label><select id="demoStage">${[1,2,3,4,5,6].map(v=>`<option value="${v}" ${stage===v?'selected':''}>Stage ${v}</option>`).join('')}</select></div><div class="settingsline"><label for="demoGroup">Student group</label><select id="demoGroup" ${stage!==2?'disabled':''}>${GROUPS.map(g=>`<option ${g===group?'selected':''}>${g}</option>`).join('')}</select></div><button class="role-option ${role==='student'?'active':''}" data-role="student"><span class="avatar">${esc(group)}</span><span><strong>Student</strong><small>Read-only channels</small></span>${svg('chevron')}</button><div class="sectionlabel">Group administrators</div>`+ACCOUNTS.filter(a=>a.id.startsWith('group-')).map(accountOption).join('')+'<div class="sectionlabel">Stage administrators</div>'+ACCOUNTS.filter(a=>a.id.startsWith('stage-')).map(accountOption).join('')+`<div class="sectionlabel">University administration</div><button class="role-option ${role==='super'?'active':''}" data-role="super"><span class="avatar">S</span><span><strong>Super administrator</strong><small>Manage all stages and permissions</small></span>${svg('chevron')}</button><button class="quiet" id="resetDemo">Reset this demo</button>`);$('demoStage').onchange=e=>{$('demoGroup').disabled=+e.target.value!==2};for(const b of $('modalBody').querySelectorAll('[data-role]'))b.onclick=()=>{stage=+$('demoStage').value;group=$('demoGroup').value;role=b.dataset.role;if(role==='admin')account=b.dataset.account;superStage=2;$('modal').close();$('channelSearch').value='';resetChat();renderSidebar()};$('resetDemo').onclick=()=>{if(confirm('Reset demo messages, permissions and read history?')){data={messages:structuredClone(seed),reads:{},permissions:defaults()};save();$('modal').close();resetChat();renderSidebar()}}}
function accountOption(a){return `<button class="role-option ${role==='admin'&&account===a.id?'active':''}" data-role="admin" data-account="${a.id}"><span class="avatar">${a.initial}</span><span><strong>${esc(a.name)}</strong><small>${esc(scopeLabel(data.permissions[a.id]||{scope:'none'}))}</small></span>${svg('chevron')}</button>`}
function managePermissions(){if(role!=='super')return;showModal(modalHead('Publishing access')+'<p>Choose an administrator to grant or revoke announcement permissions. Lecture-upload access remains separate.</p>'+ACCOUNTS.map(a=>`<button class="role-option" data-perm="${a.id}"><span class="avatar">${a.initial}</span><span><strong>${esc(a.name)}</strong><small>${esc(scopeLabel(data.permissions[a.id]||{scope:'none'}))}</small></span>${svg('chevron')}</button>`).join(''));for(const b of $('modalBody').querySelectorAll('[data-perm]'))b.onclick=()=>editPermissions(b.dataset.perm)}
function editPermissions(id){if(role!=='super')return;const a=ACCOUNTS.find(a=>a.id===id);if(!a)return;const p=data.permissions[id]||{scope:'none',groups:[]};showModal(modalHead(a.name)+`<p>Choose where this account may publish messages.</p><div class="perm-options">${[['group','Specific Stage 2 groups'],['stage','All Stage 2 channels'],['medicine','All six Medicine stages + college-wide'],['none','No publishing access']].map(([v,t])=>`<label><input type="radio" name="scope" value="${v}" ${p.scope===v?'checked':''}>${t}</label>`).join('')}</div><div id="permGroups" class="perm-grid" ${p.scope==='group'?'':'hidden'}>${GROUPS.map(g=>`<label><input type="checkbox" value="${g}" ${p.groups.includes(g)?'checked':''}><span>${g}</span></label>`).join('')}</div><button class="primary" id="savePerm">Save permissions</button><button class="quiet" id="backPerm">Back to administrators</button>`);for(const r of $('modalBody').querySelectorAll('[name=scope]'))r.onchange=()=>{$('permGroups').hidden=r.value!=='group'};$('backPerm').onclick=managePermissions;$('savePerm').onclick=()=>{if(role!=='super')return;let scope=$('modalBody').querySelector('[name=scope]:checked').value,groups=[...$('permGroups').querySelectorAll('input:checked')].map(c=>c.value);if(scope==='group'&&!groups.length){toast('Select at least one group');return}data.permissions[id]={scope,groups:scope==='group'?groups:[]};save();managePermissions();toast('Permissions updated locally')}}
function messageActions(id){let m=data.messages.find(x=>x.id===id);if(!m||!messages(active).includes(m))return;let actions=[['copy','Copy text','copy']];if(canManage(m))actions.push(['edit','Edit message','edit'],['pin',m.pinned?'Unpin message':'Pin message','pin'],['forward','Forward to channel','forward'],['eye','View demo read count','stats'],['trash','Delete message','delete']);showModal(modalHead('Message')+actions.map(([i,t,a])=>`<button class="action ${a==='delete'?'danger':''}" data-act="${a}">${svg(i)}${esc(t)}</button>`).join(''));for(const b of $('modalBody').querySelectorAll('[data-act]'))b.onclick=async()=>{let a=b.dataset.act;$('modal').close();if(a==='copy'){try{await navigator.clipboard.writeText(m.text||'');toast('Copied')}catch{toast('Copy unavailable in this browser')}return}if(!canManage(m))return;if(a==='edit'){editId=m.id;attachment=m.file||null;$('message').value=m.text;updateComposer();$('message').focus();return}if(a==='pin'){m.pinned=!m.pinned;save();renderChat();return}if(a==='delete'){if(confirm('Delete this announcement from the demo?')){data.messages=data.messages.filter(x=>x.id!==id);if(editId===id)resetDraft();save();renderChat();renderSidebar()}return}if(a==='stats'){let n=Object.values(data.reads).filter(r=>r[id]).length;showModal(modalHead('Read statistics')+`<p>${n} simulated student account${n===1?' has':'s have'} opened this message. These are local prototype counts, not delivery receipts.</p>`);return}if(a==='forward'){let targets=channels().filter(c=>c!==m.channel&&canWrite(c));showModal(modalHead('Forward to')+'<p>Send a copy to another authorized demo channel.</p>'+targets.map(c=>`<button class="action" data-target="${c}">${svg('forward')}${title(c)}</button>`).join(''));for(const b of $('modalBody').querySelectorAll('[data-target]'))b.onclick=()=>{let c=b.dataset.target;if(!canWrite(c))return;data.messages.push({...m,id:uid(),channel:c,author:actor(),at:Date.now(),pinned:false,edited:false});save();$('modal').close();renderSidebar();toast('Forwarded to '+title(c))}}}}
$('roleBtn').onclick=roleModal;$('manageBtn').onclick=managePermissions;$('channelSearch').oninput=renderSidebar;$('backBtn').onclick=()=>{resetChat();renderSidebar()};$('searchBtn').onclick=()=>{$('chatSearch').hidden=!$('chatSearch').hidden;if(!$('chatSearch').hidden)$('msgSearch').focus();else{query='';$('msgSearch').value='';renderChat()}};$('closeSearch').onclick=()=>{$('chatSearch').hidden=true;query='';$('msgSearch').value='';renderChat(true)};$('msgSearch').oninput=e=>{query=e.target.value.trim().toLowerCase();renderChat()};$('infoBtn').onclick=()=>showModal(modalHead(title(active))+`<p>${esc(desc(active))}. ${isStudent()?'Only authorized administrators may publish.':'Messages are visible to the selected demo audience.'}</p><p>This is a standalone prototype. No data is sent to HMU, Supabase, Cloudflare or OneSignal.</p>`);$('message').oninput=()=>{let m=$('message');m.style.height='auto';m.style.height=Math.min(m.scrollHeight,120)+'px';updateComposer()};$('message').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}};$('sendBtn').onclick=send;$('cancelEdit').onclick=resetDraft;$('attachBtn').onclick=()=>{$('attachMenu').hidden=!$('attachMenu').hidden};function pick(accept){$('fileInput').accept=accept;$('fileInput').click();$('attachMenu').hidden=true}$('photoBtn').onclick=()=>pick('image/png,image/jpeg,image/webp,image/gif');$('docBtn').onclick=()=>pick('.pdf,.txt,application/pdf,text/plain');$('fileInput').onchange=()=>{const f=$('fileInput').files[0];$('fileInput').value='';if(!f)return;const allowed=['application/pdf','text/plain','image/png','image/jpeg','image/webp','image/gif'];if(!allowed.includes(f.type)){toast('Choose a PDF, text file or supported image.');return}if(f.size>2*1024*1024){toast('Demo attachment limit: 2 MB.');return}const c=active,r=actor();let reader=new FileReader();reader.onload=()=>{if(active!==c||actor()!==r||!canWrite(c))return;attachment={name:f.name,type:f.type,size:f.size,data:reader.result};updateComposer()};reader.onerror=()=>toast('Could not read attachment');reader.readAsDataURL(f)};$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').close()});$('modal').addEventListener('close',()=>previousFocus?.focus?.());window.addEventListener('storage',e=>{if(e.key!==KEY)return;try{const n=JSON.parse(e.newValue);if(n&&Array.isArray(n.messages)&&n.reads){data={...n,permissions:n.permissions||defaults()};if(active&&!channels().includes(active))resetChat();renderSidebar();renderChat();if(active&&isStudent()){markRead(active);renderSidebar()}}}catch{}});renderSidebar();renderChat();
</script></body></html>
